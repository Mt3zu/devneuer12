# Replace YOUR_FLY_APP_NAME with the exact name of your Fly.io app.
app = "neuejshsbsvssvsvr"
primary_region = "dxb"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[mounts]
  source = "bot_data"
  destination = "/app/persist"
  processes = ["app"]

[vm]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
